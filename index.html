  const hip=lerp2(a.hip,b.hip,t), torso=lerp(a.torso||0,b.torso||0,t)*Math.PI/180;
  const dir=[Math.sin(torso),-Math.cos(torso)];
  const shOf=(p)=>{const r=(p.torso||0)*Math.PI/180;return [p.hip[0]+Math.sin(r)*LEN.torso,p.hip[1]-Math.cos(r)*LEN.torso]};
  const sh=[hip[0]+dir[0]*LEN.torso,hip[1]+dir[1]*LEN.torso];
  const L=(p,q,w,o)=>`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke-width="${w||7}"${o?` opacity="${o}"`:''}/>`;
  let eq='',body='',tool='';

  if(front){
    const cx=hip[0], sR=[cx+19,sh[1]], hR=[cx+9,hip[1]];
    const foot=lerp2(a.foot,b.foot,t), fR=[cx+foot[0],foot[1]];
    let hand;
    if(a.ha){const h=lerp2(a.ha,b.ha,t);hand=[cx+h[0],h[1]]}
    else if(A.arc){const pa=[Math.atan2(a.hr[1],a.hr[0]),Math.hypot(...a.hr)],pb=[Math.atan2(b.hr[1],b.hr[0]),Math.hypot(...b.hr)];const an=lerp(pa[0],pb[0],t),r=lerp(pa[1],pb[1],t);hand=[sR[0]+Math.cos(an)*r,sR[1]+Math.sin(an)*r]}
    else{const h=lerp2(a.hr,b.hr,t);hand=[sR[0]+h[0],sR[1]+h[1]]}
    const [el,hd]=ik(sR,hand,LEN.ua,LEN.fa,A.ed||1), [kn,ft]=ik(hR,fR,LEN.th,LEN.sh,-1);
    const m=p=>[2*cx-p[0],p[1]];
    [[hR,kn],[kn,ft],[sR,el],[el,hd]].forEach(([p,q])=>{body+=L(p,q)+L(m(p),m(q))});
    body+=L([cx-19,sh[1]],[cx+19,sh[1]],8)+L([cx,sh[1]],[cx,hip[1]],16)+`<circle cx="${cx}" cy="${sh[1]-15}" r="9.5"/>`;
    if(imp==='db'||imp==='')[hd,m(hd)].forEach(p=>{if(imp==='db')tool+=`<rect x="${(p[0]-7).toFixed(1)}" y="${(p[1]-4).toFixed(1)}" width="14" height="8" rx="3"/>`});
  }else{
    const foot=lerp2(a.foot,b.foot,t), kd=A.kd||-1;
    const hA=a.hand||[shOf(a)[0]+a.hr[0],shOf(a)[1]+a.hr[1]], hB=b.hand||[shOf(b)[0]+b.hr[0],shOf(b)[1]+b.hr[1]];
    const hand=lerp2(hA,hB,t);
    if(a.foot2){const f2=lerp2(a.foot2,b.foot2||a.foot2,t),[k2,e2]=ik(hip,f2,LEN.th,LEN.sh,kd);body+=L(hip,k2,7,.45)+L(k2,e2,7,.45)+L(e2,[e2[0]+9,e2[1]],6,.45)}
    const [kn,ft]=ik(hip,foot,LEN.th,LEN.sh,kd), [el,hd]=ik(sh,hand,LEN.ua,LEN.fa,A.ed||1);
    body+=L(hip,kn)+L(kn,ft)+(A.nofoot?'':L(ft,[ft[0]+10,ft[1]],6))+L(hip,sh,11)+`<circle cx="${(sh[0]+dir[0]*15).toFixed(1)}" cy="${(sh[1]+dir[1]*15).toFixed(1)}" r="9.5"/>`+L(sh,el)+L(el,hd);
    if(A.plat)eq+=L([ft[0]+7,ft[1]-24],[ft[0]+7,ft[1]+24],6);
    let at=hd; if(A.impAt==='sh')at=[sh[0]+A.impOff[0],sh[1]+A.impOff[1]]; if(A.impAt==='hip')at=[hip[0]+A.impOff[0],hip[1]+A.impOff[1]];
    if(A.cable)tool+=`<line x1="${A.cable[0]}" y1="${A.cable[1]}" x2="${hd[0].toFixed(1)}" y2="${hd[1].toFixed(1)}" stroke-width="2"/><circle cx="${hd[0].toFixed(1)}" cy="${hd[1].toFixed(1)}" r="4"/>`;
    else if(imp==='bar')tool+=`<circle cx="${at[0].toFixed(1)}" cy="${at[1].toFixed(1)}" r="12" fill-opacity=".25"/><circle cx="${at[0].toFixed(1)}" cy="${at[1].toFixed(1)}" r="3.5"/>`;
    else if(imp==='db')tool+=`<circle cx="${at[0].toFixed(1)}" cy="${at[1].toFixed(1)}" r="6.5"/>`;
  }
  const g=A.scale?` transform="translate(120 12) scale(${A.scale}) translate(-120 -12)"`:'';
  return `<g class="eq" fill="var(--mut)" stroke="var(--mut)" stroke-linecap="round">${A.noGround?'':'<line x1="14" y1="183" x2="226" y2="183" stroke-width="2" opacity=".5"/>'}${eq}</g><g${g}><g class="bd" stroke="var(--ink)" fill="var(--ink)" stroke-linecap="round">${body}</g><g class="tl" stroke="var(--acc)" fill="var(--acc)" stroke-linecap="round">${tool}</g></g>`;
}

const e1rmOf=(w,r,rir)=>w*(1+(r+(rir||0))/30);
function estimateAnchors(p){
  const lv=p.level, m=p.sex==='m';
  const f={banca:m?[.5,.8,1.1]:[.25,.45,.65],sentadilla:m?[.7,1.1,1.5]:[.45,.8,1.1],jalon:m?[.5,.75,1]:[.35,.5,.7]};
  const age=p.age>=60?.75:p.age>=50?.85:1, bw=Math.min(p.w,p.sex==='m'?95:80);
  const o={};for(const k in f)o[k]=rnd(bw*f[k][lv]*age,2.5);return o;
}
function e1(S,id){const x=EX[id];if(S.e1rm[id])return S.e1rm[id];if(!x.anchor)return 0;return (S.anchors[x.anchor]||0)*x.ratio}
function lastLog(S,id){for(let i=S.workouts.length-1;i>=0;i--){const e=S.workouts[i].ex.find(e=>e.id===id&&e.sets.length);if(e)return e}return null}
function nextTarget(S,slot){
  const x=EX[slot.id], last=lastLog(S,slot.id), rir=S.plan?S.plan.rir:2;
  if(x.bw){const r=last?Math.max(...last.sets.map(s=>s.r)):slot.lo;return {w:last?last.sets[0].w:0,r:last?Math.min(r+(x.time?5:1),x.time?120:30):slot.lo,why:last?'Una más que la última vez':'Punto de partida'}}
  const inc=x.inc||2.5;
  if(last){
    const w=last.sets[0].w, all=last.sets.length>=slot.sets-1&&last.sets.every(s=>s.w>=w&&s.r>=slot.hi);
    if(last.feel==='facil'||all)return {w:w+inc,r:slot.lo,why:all?'Llegaste al tope de repeticiones: subes peso':'Te sobró: subes peso'};
    if(last.sets[0].r<slot.lo-1||(last.feel==='limite'&&last.sets[0].r<slot.lo))return {w:Math.max(inc,rnd(w*.93,inc)),r:slot.lo,why:'No llegaste al mínimo: bajas un poco'};
    return {w,r:Math.min(slot.hi,last.sets[0].r+1),why:'Mismo peso, busca una repetición más'};
  }
  const mid=(slot.lo+slot.hi)/2, w=e1(S,slot.id)/(1+(mid+rir)/30)*.95;
  return {w:Math.max(inc,rnd(w,inc)),r:slot.lo,why:S.tested?'Calculado a partir de tu test':'Estimación inicial: ajústalo en la primera serie'};
}

const LEGK=['LA','LB','LE','LE2'];
function splitFor(p){
  const ks=((STRUCT[p.split||'auto']||{})[p.days]||STRUCT.auto[p.days]).slice(), isLeg=ks.map(k=>LEGK.includes(k)), legs=isLeg.filter(Boolean).length;
  if(p.focus==='torso'&&legs>=2)ks[isLeg.lastIndexOf(true)]=['AR','UB','UA','PU','PL'].find(k=>!ks.includes(k));
  if(p.focus==='pierna'&&legs===1){const t=['AR','PU2','PL2','UB'].map(k=>ks.lastIndexOf(k)).find(i=>i>=0);if(t!==undefined)ks[t]=['LB','LA','LE'].find(k=>!ks.includes(k))}
  return ks;
}
const SUB={manc:{banca:'bancaManc',remoBarra:'remoManc',curlBarra:'curlManc'},maq:{banca:'pressMaq',sentadilla:'prensa',remoBarra:'remoPolea',curlBarra:'curlManc',pressFrances:'tricepsPolea',hipThrust:'curlFem',rdl:'curlFem'},

hombro:{pressHombro:'elevLat',banca:'pressMaq',dominadas:'jalon',pressFrances:'tricepsPolea'},

function generatePlan(p,prefs){prefs=prefs||{};
  const g=GOALS[p.goal], careful=p.age>=55||p.sleep===0||p.level===0;
  const rir=g.rir+(careful?1:0);
  const days=splitFor(p).map(k=>{
    let ids=TPL[k][1].map(id=>{
      if(SUB[p.equip]&&SUB[p.equip][id])id=SUB[p.equip][id];
      for(const l of p.lim||[])if(SUB[l]&&SUB[l][id])id=SUB[l][id];
      return prefs[id]||id});
    const rot=(a,n)=>a.slice(n%a.length).concat(a.slice(0,n%a.length)),ti=k.charCodeAt(1)-65;
    if(k[0]==='F'&&p.focus==='torso'){let first=true;ids=ids.map(id=>{if(EX[id].grp!=='Pierna')return id;if(first){first=false;return id}return rot(['elevLat','facePull','curlBarra','tricepsPolea','pecDeck','remoPolea'],ti*2).find(o=>!ids.includes(o))||id})}
    if(k[0]==='F'&&p.focus==='pierna'){const i=ids.map(id=>/ceps/.test(EX[id].grp)).lastIndexOf(true),alt=rot(['extCuad','gemelo','hipThrust','curlFem'],ti).find(o=>!ids.includes(o));if(i>=0&&alt)ids[i]=alt}
    const seen=new Set();ids=ids.map(id=>{
      if(!seen.has(id)){seen.add(id);return id}
      const alt=EXR.map(r=>r[0]).find(o=>EX[o].grp===EX[id].grp&&!seen.has(o)&&!EX[o].bw&&!Object.values(SUB).some(m=>m[o]&&((SUB[p.equip]===m)||(p.lim||[]).some(l=>SUB[l]===m))));
      if(alt){seen.add(alt);return alt}return null}).filter(Boolean);
    let ex=ids.map((id,i)=>{const x=EX[id],c=x.comp;
      let sets=c?(i<2?g.sc:Math.min(g.sc,3)):g.si; if(careful&&sets>3)sets=3;
      const [lo,hi]=x.time?[30,60]:x.bw?[8,15]:c?g.c:g.i;
      return {id,sets,lo,hi,rest:c?g.rc:g.ri}});
    const secs=e=>e.reduce((s,x)=>s+x.sets*(x.rest+45)+60,0)+300;
    while(ex.length>4&&secs(ex)>p.dur*60*1.08){const i=ex.map(e=>e.sets>3).lastIndexOf(true);if(i>=0)ex[i].sets--;else ex.pop()}
    return {name:TPL[k][0],ex}});
  return {goal:p.goal,rir,days,next:0,cardio:g.cardio};
}

function wordsToNum(s){
  const tk=s.split(/\s+/),out=[];
  for(let i=0;i<tk.length;i++){let v=NUMW[tk[i]];
    if(v===undefined){out.push(tk[i]);continue}
    if(v>=100&&NUMW[tk[i+1]]!==undefined&&NUMW[tk[i+1]]<100){v+=NUMW[tk[++i]]}
    if(v%100>=30&&v%10===0&&tk[i+1]==='y'&&NUMW[tk[i+2]]>=1&&NUMW[tk[i+2]]<=9){v+=NUMW[tk[i+2]];i+=2}

  s=wordsToNum(s).replace(/(\d+) y medio/g,'$1.5').replace(/(\d+) (?:con|coma|punto) (\d)\b/g,'$1.$2');
  const out=[];
  s.split(/[,;]|\.\s|\.$|\by luego\b|\bluego\b|\bdespues\b/).map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    let m;

  <div class="row"><button class="btn ghost sm" data-act="setAdd">+ Serie</button><button class="btn ghost sm" data-act="setDel">− Serie</button></div>
  <label>¿Cómo ha ido la última serie?</label>${chips(`S.active.ex.${A.cur}.feel`,[['facil','Me sobraba'],['bien','Justo'],['limite','Al límite']])}
  <button class="btn wide" data-act="wkGo" data-i="${A.cur+1}">${A.cur<A.ex.length-1?'Siguiente ejercicio':'Terminar entrenamiento'}</button></div>
  <div class="card form"><label for="swx">Cambiar este ejercicio</label><select class="sel" id="swx" data-chg="swapWk"><option value="">Elegir otro de ${x.grp.toLowerCase()}</option>${alts.map(id=>`<option value="${id}">${EX[id].name}</option>`).join('')}</select>
  <label for="adx">Añadir un ejercicio</label><select class="sel" id="adx" data-chg="addWk"><option value="">Elegir ejercicio</option>${GROUPS.map(g=>`<optgroup label="${g}">${EXR.filter(r=>r[2]===g&&!A.ex.some(o=>o.id===r[0])).map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</optgroup>`).join('')}</select></div>`}
function markDone(j,on){
  const A=S.active,e=A.ex[A.cur],s=e.sets[j];s.done=on;
  if(on){A.rest=Date.now()+e.restS*1000;const n=e.sets[j+1];if(n&&!n.done){n.w=s.w;if(!EX[e.id].time)n.r=s.r}}
  save();renderWk()}
function applyVoice(text,keep){
  const A=S.active;if(!A||!text.trim())return;const cmds=parseVoice(text),msg=[];
  cmds.forEach(c=>{const e=A.ex[A.cur],x=EX[e.id];
    if(c.t==='next'){if(A.cur<A.ex.length-1){A.cur++;msg.push('Siguiente: '+EX[A.ex[A.cur].id].name)}}
    else if(c.t==='prev'){if(A.cur>0){A.cur--;msg.push('Anterior: '+EX[A.ex[A.cur].id].name)}}
    else if(c.t==='undo'){const d=e.sets.map(s=>s.done).lastIndexOf(true);if(d>=0){e.sets[d].done=false;msg.push('Serie '+(d+1)+' desmarcada')}}
    else{let j=e.sets.findIndex(s=>!s.done);if(j<0){const l=e.sets[e.sets.length-1]||{w:0,r:e.lo};e.sets.push({w:l.w,r:l.r,done:false});j=e.sets.length-1}
      const s=e.sets[j],prev=e.sets.slice(0,j).reverse().find(q=>q.done);
      if(c.t==='same'){if(prev){s.w=prev.w;s.r=prev.r}}else{if(c.w!=null)s.w=c.w;if(c.r!=null)s.r=c.r}
      s.done=true;A.rest=Date.now()+e.restS*1000;const n=e.sets[j+1];if(n&&!n.done){n.w=s.w;if(!x.time)n.r=s.r}
      msg.push(`Serie ${j+1}: ${x.bw&&!s.w?'':fmt(s.w)+' kg × '}${s.r}`)}});
  const el=$('#dmsg'),inp=$('#dict');
  if(msg.length){save();renderWk();if(inp&&!keep)inp.value='';if(el){el.textContent='✓ '+msg.join(' · ');el.className='ok'}}
  else if(el){el.textContent=`No lo he entendido: «${text.trim()}». Prueba «80 por 10».`;el.className='bad'}}
function endWorkout(){
  const A=S.active,ex=A.ex.map(e=>({id:e.id,feel:e.feel,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r}))})).filter(e=>e.sets.length);
  if(!ex.length){S.active=null;UI.inWk=false;save();render();return}
  const prs=[];let vol=0,sets=0;
  ex.forEach(e=>{const x=EX[e.id];sets+=e.sets.length;e.sets.forEach(s=>vol+=s.w*s.r*(x.pm?2:1));if(x.bw)return;
    const rir={facil:3,bien:1.5,limite:0}[e.feel]??1,best=Math.max(...e.sets.map(s=>e1rmOf(s.w,s.r,0)));
    const hist=Math.max(0,...S.workouts.flatMap(w=>w.ex.filter(o=>o.id===e.id).flatMap(o=>o.sets.map(s=>e1rmOf(s.w,s.r,0)))));
    if(hist&&best>hist+.01)prs.push({n:x.name,v:Math.round(best*10)/10});
    const est=Math.max(...e.sets.map(s=>e1rmOf(s.w,s.r,rir)));S.e1rm[e.id]=Math.round((S.e1rm[e.id]?S.e1rm[e.id]*.5+est*.5:est)*10)/10;
    if(x.ratio===1)S.anchors[x.anchor]=S.e1rm[e.id]});
  const w={id:A.id,ts:A.ts,dur:Math.round((Date.now()-A.ts)/1000),name:A.name,d:A.d,ex};
  S.workouts.push(w);S.plan.next=(A.d+1)%S.plan.days.length;S.active=null;UI.inWk=false;UI.selDay=null;
  UI.modal={t:'sum',name:w.name,dur:w.dur,sets,vol,prs};save();render();window.scrollTo(0,0)}

/* ---------- Render ---------- */
const TABS=[['hoy','Hoy'],['rutina','Rutina'],['dieta','Dieta'],['progreso','Progreso'],['perfil','Perfil']];
function renderWk(){if(!$('#wk'))$('#app').innerHTML=wkShell();$('#wkbody').innerHTML=wkBody();tick()}
function render(){
  const app=$('#app');
  if(F){app.innerHTML=vOnboard();return}
  if(!S.profile){app.innerHTML=`<main class="ob"><p class="eyebrow">Entrenador personal de gimnasio</p><h1>Forja</h1><div class="card"><p>Rutina y menú hechos a tu medida, con registro de series tocando o dictando.</p><ul class="cues"><li>Cuatro pantallas de preguntas, sin escribir</li><li>Un test de fuerza guiado para ajustar los pesos</li><li>Menú con comida de supermercado y platos de tu casa</li></ul></div><button class="btn wide" data-act="obStart">Empezar</button><p class="mut c" id="sync">${syncTxt()}</p></main>`;return}
  if(UI.test){app.innerHTML=vTest();return}
  if(S.active&&UI.inWk){renderWk();return}
  const v={hoy:vHoy,rutina:vRutina,dieta:vDieta,progreso:vProgreso,perfil:vPerfil}[UI.tab]||vHoy;
  app.innerHTML=`<main>${v()}</main><nav class="tabs">${TABS.map(([k,l])=>`<a href="#${k}" class="${k===UI.tab?'on':''}">${l}</a>`).join('')}</nav>${vModal()}`}
function tick(){
  const A=S.active;if(!A)return;const el=$('#elapsed');if(el){const s=Math.floor((Date.now()-A.ts)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  const r=$('#rest');if(r){const left=Math.ceil((A.rest-Date.now())/1000);if(A.rest&&left>-20){r.hidden=false;$('#restt').textContent=left>0?`Descanso ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'A por la siguiente serie';r.className=left>0?'':'go'}else r.hidden=true}}
setInterval(tick,500);
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;let lastF=0;
function frame(t){if(t-lastF>40){lastF=t;const ph=still?1:.5-.5*Math.cos(t/1300*Math.PI);document.querySelectorAll('svg.anim').forEach(s=>{s.innerHTML=figSVG(s.dataset.a,s.dataset.i,ph)})}requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- Acciones ---------- */
const ACT={
stp(d,b){const sel=b.parentNode.querySelector('select'),min=+sel.dataset.min,max=+sel.dataset.max,step=+sel.dataset.step;
  const v=clamp(Math.round((+sel.value+(+d.dir)*step)*100)/100,min,max);sel.innerHTML=optsHtml(v,min,max,step);setP(sel.dataset.path,v);if(sel.dataset.path[0]==='S')save()},
chip(d,b){const v=d.num?+d.val:d.val;if(d.multi){const a=getP(d.path)||[],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);setP(d.path,a);b.classList.toggle('on')}
  else{setP(d.path,v);[...b.parentNode.children].forEach(c=>c.classList.toggle('on',c===b))}
  if(d.path[0]==='S')save();if(d.rr){if(UI.test)prepTest();render()}},
obStart(){startOnboarding(false)},obNext(){UI.ob++;render();window.scrollTo(0,0)},obPrev(){UI.ob--;render();window.scrollTo(0,0)},obCancel(){F=null;render()},obDone(){finishOnboarding();window.scrollTo(0,0)},
edit(){startOnboarding(true);window.scrollTo(0,0)},
testStart(){startTest();window.scrollTo(0,0)},testGo(){UI.test.intro=false;render();window.scrollTo(0,0)},testSkipAll(){UI.test=null;render()},testSkip(){testNext(false)},testSave(){testNext(true)},
tab(d){location.hash=d.t},
selDay(d){UI.selDay=+d.i;render()},
exInfo(d){UI.modal={t:'ex',d:+d.d,i:+d.i};render()},
mClose(d,b,e){if(d.force||e.target===b){UI.modal=null;render()}},
wkStart(d){startWorkout(+d.d)},wkBack(){UI.inWk=false;render()},
wkEnd(){endWorkout()},
wkGo(d){const A=S.active,i=+d.i;if(i>=A.ex.length){endWorkout();return}A.cur=i;save();renderWk();window.scrollTo(0,0)},
setDone(d){const s=S.active.ex[S.active.cur].sets[+d.j];markDone(+d.j,!s.done)},
setAdd(){const e=S.active.ex[S.active.cur],l=e.sets[e.sets.length-1]||{w:0,r:e.lo};e.sets.push({w:l.w,r:l.r,done:false});save();renderWk()},
setDel(){const e=S.active.ex[S.active.cur];if(e.sets.length>1){e.sets.pop();save();renderWk()}},
restAdd(){S.active.rest=Math.max(S.active.rest,Date.now())+30000;save();tick()},restSkip(){S.active.rest=0;save();tick()},
dictGo(){dictFlush()},
wSave(){const kg=UI.wIn,t=Date.now(),l=S.weights[S.weights.length-1];if(l&&t-l.t<12*36e5)l.kg=kg,l.t=t;else S.weights.push({t,kg});S.profile.w=kg;save();render()},
dDay(d){UI.dietDay=+d.i;render()},
mSwap(d){const p=S.profile,i=+d.i,s=SLOTS[p.meals][i],fam=(p.famSlots||[]).includes(s[0]);let c=candidates(s[0],p,fam);if(fam)c=[...new Set(c.concat(candidates(s[0],p,false)))];
  const cur=S.diet.week[UI.dietDay][i];S.diet.week[UI.dietDay][i]=c[(c.indexOf(cur)+1)%c.length];save();render()},
shop(){UI.shop=!UI.shop;render()},
adj(d){S.kcalAdj+=+d.v;S.adjTs=Date.now();save();render()},
kc(d){S.kcalAdj=clamp(S.kcalAdj+(+d.v),-600,600);save();render()},
wDel(d){S.workouts=S.workouts.filter(w=>String(w.id)!==d.id);save();render()},
backup(){const j=JSON.stringify(S),m=$('#bmsg');const fb=()=>{UI.restore=true;render();$('#rest').value=j;$('#bmsg').textContent='No he podido copiar automáticamente. Selecciona el texto y cópialo.'};
  try{navigator.clipboard.writeText(j).then(()=>{m.textContent='Copiado. Pégalo en Notas o envíatelo por correo.'},fb)}catch(e){fb()}},
restoreT(){UI.restore=!UI.restore;render()},
restore(){try{const o=JSON.parse($('#rest').value);if(!o.profile)throw 0;S={...blank(),...o};save();UI.restore=false;render()}catch(e){$('#bmsg').textContent='Ese texto no es una copia válida.'}},
wipe(){if(!UI.wipe){UI.wipe=1;render();return}UI.wipe=0;S=blank();save();render()},
};
const CHG={
swapPlan(v){const m=UI.modal;if(!v)return;const old=S.plan.days[m.d].ex[m.i].id,x=EX[v],g=GOALS[S.plan.goal];for(const k in S.prefs)if(S.prefs[k]===old)S.prefs[k]=v;S.prefs[old]=v;delete S.prefs[v];
  S.plan.days.forEach(d=>{if(d.ex.some(s=>s.id===v))return;d.ex.forEach(s=>{if(s.id===old){s.id=v;[s.lo,s.hi]=x.time?[30,60]:x.bw?[8,15]:x.comp?g.c:g.i}})});save();render()},
swapWk(v){if(!v)return;const A=S.active,o=A.ex[A.cur],g=GOALS[S.plan.goal],x=EX[v];const [lo,hi]=x.time?[30,60]:x.bw?[8,15]:x.comp?g.c:g.i;A.ex[A.cur]=mkEx({id:v,sets:o.sets.length,lo,hi,rest:o.restS});save();renderWk()},
addWk(v){if(!v)return;const A=S.active,g=GOALS[S.plan.goal],x=EX[v];const [lo,hi]=x.time?[30,60]:x.bw?[8,15]:x.comp?g.c:g.i;A.ex.push(mkEx({id:v,sets:3,lo,hi,rest:x.comp?g.rc:g.ri}));A.cur=A.ex.length-1;save();renderWk();window.scrollTo(0,0)},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='mClose'&&e.target.closest('[data-stop]')&&!e.target.closest('[data-force]'))return;if(b.dataset.act!=='wipe')UI.wipe=0;ACT[b.dataset.act](b.dataset,b,e)});
document.addEventListener('change',e=>{const s=e.target;if(s.dataset.chg){CHG[s.dataset.chg](s.value);return}
  if(s.dataset.path){setP(s.dataset.path,s.dataset.str?s.value:+s.value);if(s.dataset.path[0]==='S')save();if(s.dataset.rr)render()}});
let dT=null;
let dDone='';const dRest=v=>v.startsWith(dDone)?v.slice(dDone.length):v;
function dictFlush(){clearTimeout(dT);const i=$('#dict');if(!i)return;const r=dRest(i.value);dDone='';if(r.trim())applyVoice(r);else i.value=''}
document.addEventListener('input',e=>{if(e.target.id!=='dict')return;clearTimeout(dT);dT=setTimeout(()=>{const v=e.target.value,r=dRest(v);if(parseVoice(r).length){applyVoice(r,true);dDone=v}},1600)});
document.addEventListener('keydown',e=>{if(e.target.id==='dict'&&e.key==='Enter')dictFlush()});
document.addEventListener('focusout',e=>{if(e.target.id==='dict'){clearTimeout(dT);const r=dRest(e.target.value);if(parseVoice(r).length)applyVoice(r,true);e.target.value='';dDone=''}});
function route(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){UI.tab=h;UI.modal=null;if(S.profile&&!F&&!UI.test){UI.inWk=false;render();window.scrollTo(0,0)}}}
window.addEventListener('hashchange',route);
loadLocal();const h0=location.hash.slice(1);if(TABS.some(t=>t[0]===h0))UI.tab=h0;render();initCloud();
</script></body></html>
